project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - site/*.qmd
    - site/services/*.qmd

website:
  title: "ESA toolbox"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: site/usage.qmd
        text: Using the tool
      - text: Services
        menu:
          - href: site/services/pollination.qmd
            text: Crop pollination
          - href: site/services/wood.qmd
            text: Wood provision
          - href: site/services/carbon.qmd
            text: Carbon sequestration
      - href: site/inputs.qmd
        text: Inputs
      - href: site/downloads.qmd
        text: Downloads
    right:
      - icon: github
        href: https://github.com/renatovargas/esa-toolbox

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 3
